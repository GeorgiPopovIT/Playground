[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-match-ai"
version = "0.1.0"
description = "Multi-agent CV and job matching workflow converted from a notebook into a Python project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langsmith>=0.1.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
